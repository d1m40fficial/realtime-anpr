# Russian license plate config (GOST R 50577) for the FastPlate CCT-XS model.
# 9 independent character slots, 18 symbols, "_" marks an empty slot.
max_plate_slots: 9
alphabet: "0123456789ABEKMHOPCTYX_"
pad_char: "_"
img_height: 70
img_width: 140
keep_aspect_ratio: false
interpolation: linear
image_color_mode: grayscale
